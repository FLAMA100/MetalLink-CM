# ============================================================
# MOBILE BUILD pubspec — use this when building the Android APK
# ============================================================
# Instructions:
#   1. Rename pubspec.yaml  → pubspec_web.yaml
#   2. Rename pubspec_mobile.yaml → pubspec.yaml
#   3. Run: flutter pub get
#   4. Run: flutter build apk --release
#   5. Restore pubspec_web.yaml → pubspec.yaml when developing on Chrome
# ============================================================

name: metallink_cm
description: MetalLink CM - Metal Scrap Marketplace for Cameroon (Mobile Build)

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.1
  go_router: ^13.0.0
  google_fonts: ^6.1.0
  image_picker: ^1.0.7
  audioplayers: ^5.0.0
  shared_preferences: ^2.2.2
  http: ^1.2.0
  web: ^1.1.0
  intl: ^0.19.0
  uuid: ^4.3.3
  timeago: ^3.6.1
  url_launcher: ^6.2.5
  cupertino_icons: ^1.0.6

  # Mobile-only sensor packages (these pull objective_c — OK on macOS/Linux build machines)
  geolocator: ^11.0.0
  record: ^5.0.4
  path_provider: ^2.1.2
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
